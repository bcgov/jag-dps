name: Build & Unit Test 

permissions:
  contents: read
  
on:

  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spring:
    name: App Build and Test
    runs-on: ubuntu-latest
    env:
      ACTION_DEBUG: true

    steps:   
      
      - name: Build Vips Client
        working-directory: "./src/libs"
        run: git submodule update --init
        
      # Setup Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
          
          cache: maven

      - name: Checkout Repository
        uses: actions/checkout@v2

     # Run Maven Verify COA Application   
      - name: Build and Test With Maven
        run: mvn -ntp clean package --file src/pom.xml -P all